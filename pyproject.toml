[project]
name = "extraneous_speech_detect"
version = "0.1.0"
description = "Detection and removal of extraneous speech in telephone recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.19.0",
    "matplotlib>=3.6.0",
    "pytest>=7.4.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
